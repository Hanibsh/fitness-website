<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Free fitness calculators — TDEE, one rep max, protein, strength standards — plus a workout log and 1:1 online coaching with Leon." />
    <meta name="theme-color" content="#FAF9F6" />
    <!-- iPhone home-screen app: draw the page under the status bar. iOS locks a
         home-screen app's status-bar colour when it opens and ignores
         theme-color changes after that, so the theme toggle could never reach
         it. Translucent, the strip behind the clock is ours (.status-strip in
         index.css). iOS always draws the clock and battery WHITE in this mode,
         so that strip stays dark in both themes. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Leon — Fitness Coaching & Tools" />
    <meta property="og:description" content="Free fitness calculators and a workout log, plus 1:1 coaching with Leon." />
    <meta property="og:type" content="website" />
    <title>Leon — Fitness Coaching & Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Set the theme before first paint so there's no flash of the wrong mode.
         This also has to seed theme-color: the meta above is a static light
         value, and lib/theme.js only rewrites it when you hit the toggle, so
         without this a dark-mode *reload* left mobile Safari tinting its status
         bar cream. Keep these page colours in step with THEMES there. -->
    <script>
      (function () {
        try {
          var bg = { light: '#FAF9F6', dark: '#15161a', olive: '#EFE9DA', burgundy: '#2B1016', gold: '#0F0E0C' }
          var stored = localStorage.getItem('leon_theme')
          var theme = bg[stored] ? stored : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', bg[theme])
          }
        } catch (e) { document.documentElement.dataset.theme = 'light' }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
